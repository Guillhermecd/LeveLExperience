server:
  port: ${SERVER_PORT:1337}

spring:
  application:
    name: kanban
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema — anything but validate lets prod silently
      # diverge from the migration (PLAN.md Fase 3 "cuidados").
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      # Off, or every date in the API contract breaks in silence — the
      # contract is ISO-8601, never epoch millis. See GATES 3.12.
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: ${SMTP_SECURE:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:no-reply@oaksd.local}
